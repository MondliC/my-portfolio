<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MN Cloud Consulting | Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="grid-bg"></div><header><a class="brand" href="./"><span>MN</span><b>Cloud Consulting<small>Admin</small></b></a><div><span id="status">Signed out</span> <button id="logout" class="mini" hidden>Sign out</button></div></header><main class="admin-shell"><section id="login" class="login admin-panel"><span class="kicker">Private Admin</span><h1>Business command center</h1><p>Manage enquiries and site content.</p><form id="login-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary">Sign in</button><p id="login-msg"></p></form></section><section id="dashboard" hidden><h1>MN Cloud Consulting</h1><div class="admin-tabs"><button class="admin-tab active" data-type="leads">Enquiries</button><button class="admin-tab" data-type="services">Services</button><button class="admin-tab" data-type="cases">Use Cases</button><button class="admin-tab" data-type="settings">Site Text</button></div><div class="admin-grid"><section class="admin-panel"><h2 id="list-title">Enquiries</h2><div id="list" class="admin-list"></div></section><section class="admin-panel"><h2 id="editor-title">Details</h2><form id="editor"><div id="fields"><p>Select an item.</p></div><div style="display:flex;gap:8px;margin-top:12px"><button id="save" class="btn primary" hidden>Save</button><button id="new" class="mini" type="button" hidden>+ New</button><button id="delete" class="mini danger" type="button" hidden>Delete</button></div><p id="editor-msg"></p></form></section></div></section></main><script src="admin.js"></script></body></html>
